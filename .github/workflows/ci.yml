name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format check
        # Soft check — `info`-level deltas are fine, hard fails only on diffs.
        run: dart format --set-exit-if-changed --output=none lib/ test/

      - name: Analyze
        # `--fatal-infos` is too noisy given the existing withOpacity deprecations;
        # we promote warnings + errors but tolerate infos until the codebase is
        # migrated to .withValues().
        run: flutter analyze --fatal-warnings

      - name: Unit + widget tests
        run: flutter test --reporter=expanded
