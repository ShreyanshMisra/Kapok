name: kapok_app
description: "Kapok – A disaster response coordination app built with Flutter, Firebase, and Mapbox."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Core UI & Icons
  cupertino_icons: ^1.0.9

  # Firebase Core + Services
  # Capped below the FlutterFire releases that adopted the iOS UIScene API
  # (FlutterSceneLifeCycleDelegate), which requires Flutter >= 3.38. Lift the
  # caps after upgrading the Flutter SDK.
  firebase_core: '>=4.2.0 <4.6.0'
  firebase_auth: '>=6.1.1 <6.3.0'
  cloud_firestore: '>=6.1.3 <6.2.0'
  firebase_storage: '>=13.1.0 <13.2.0'
  firebase_crashlytics: '>=5.0.8 <5.1.0'
  firebase_analytics: '>=12.0.3 <12.2.0'

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  provider: ^6.1.5+1

  # Local Storage (Offline-First)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Maps & Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  mapbox_maps_flutter: ^2.31.1

  # Network & Permissions
  connectivity_plus: ^6.1.5
  http: ^1.6.0

  # Localization (English + Spanish)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Dependency Injection
  get_it: ^8.3.0

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # JSON & Utility
  json_annotation: ^4.9.0

  # File Sharing
  share_plus: ^10.1.4

  # Translation
  translator: ^1.0.4+1

  # Sprints 3 & 4
  fl_chart: ^0.69.2
  badges: ^3.2.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  # Build tools for code generation
  build_runner: ^2.7.1
  json_serializable: ^6.11.2

  # Launcher icons
  flutter_launcher_icons: ^0.14.4
  # Native splash screens (Android + iOS)
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: "assets/images/kapok_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/kapok_icon.png"

# Native splash configuration. iOS keeps its custom LaunchScreen.storyboard;
# this primarily fills in the Android gap so the app boots into a branded
# screen instead of a default Flutter splash.
# Generate with: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#013576"          # AppColors.primary
  image: assets/images/kapok_icon.png
  android: true
  ios: false                # iOS already has LaunchScreen.storyboard
  web: false
  android_12:
    color: "#013576"
    image: assets/images/kapok_icon.png

flutter:
  uses-material-design: true

  # Localization resources
  generate: true

  # Assets
  assets:
    - assets/images/kapok_icon.png
    - assets/images/icons/
    - assets/images/icon_tagline/
    - .env

  # Example custom font setup
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
